services:
  minitor:
    build:
      context: .
      # Optional: inject the app version reported by the binary.
      # args:
      #   VERSION: 0.1.0
    image: minitor:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Persistent data directory (SQLite DB lives at /data/minitor.db).
      - DATA_DIR=/data
      # - PORT=8080
      # - RETENTION_DAYS=30
      # - SECURE_COOKIES=true
      # - ADMIN_PASSWORD=changeme
      # - SECRET_KEY=generate-a-long-random-string
      # SMTP alerting (all-or-nothing; omit to disable alerting).
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USERNAME=user@example.com
      # - SMTP_PASSWORD=changeme
      # - SMTP_FROM=minitor@example.com
    volumes:
      - minitor-data:/data

volumes:
  minitor-data:
