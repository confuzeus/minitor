{{define "content"}}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
    <h1 class="text-xl font-semibold text-center mb-6">Minitor</h1>
    {{if .Error}}<div class="mb-4 p-3 text-sm text-red-700 bg-red-100 rounded">{{.Error}}</div>{{end}}
    <form method="POST" action="/login">
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <button type="submit"
        class="w-full py-2 px-4 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Sign in
      </button>
    </form>
  </div>
</div>
{{end}}
