{{define "content"}}
<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm bg-surface border border-border rounded-lg shadow-sm p-8">
    <h1 class="text-heading font-semibold text-center text-ink mb-2">Minitor</h1>
    <p class="text-body text-ink-secondary text-center mb-6">Monitor your endpoints with calm control.</p>
    {{if .Error}}<div class="mb-4 p-3 text-sm text-danger-dark bg-danger-tint border border-danger/40 rounded-md">{{.Error}}</div>{{end}}
    <form method="POST" action="/login">
      <div class="mb-4">
        <label for="password" class="block text-small font-medium text-ink mb-1">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"
          class="w-full px-3 py-2 border border-border rounded-md text-body text-ink bg-surface shadow-sm focus:outline-none focus:ring-[3px] focus:ring-brand/40 focus:border-brand">
      </div>
      <button type="submit"
        class="w-full py-2 px-4 bg-brand hover:bg-brand-hover text-white font-medium rounded-md focus:outline-none focus:ring-[3px] focus:ring-brand/40 focus:ring-offset-2">
        Sign in
      </button>
    </form>
  </div>
</div>
{{end}}
